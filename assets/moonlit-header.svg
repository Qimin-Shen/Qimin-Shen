<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="moonlit-title moonlit-desc">
  <title id="moonlit-title">月と星の夜 · Moonlit Starry Quiet</title>
  <desc id="moonlit-desc">A quiet moonlit night: a crescent moon glowing above layered mountains, drifting mist and slowly twinkling stars.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d1f"/>
      <stop offset=".42" stop-color="#1b1939"/>
      <stop offset=".74" stop-color="#332a55"/>
      <stop offset="1" stop-color="#5d4674"/>
    </linearGradient>

    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9d1" stop-opacity=".55"/>
      <stop offset=".38" stop-color="#d5b6ff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#7f62c2" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="moon" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".55" stop-color="#f4e6ff"/>
      <stop offset="1" stop-color="#cbb1ff"/>
    </linearGradient>

    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bda9e6" stop-opacity="0"/>
      <stop offset=".45" stop-color="#e2d2f7" stop-opacity=".26"/>
      <stop offset=".7" stop-color="#c9b4ea" stop-opacity=".16"/>
      <stop offset="1" stop-color="#bda9e6" stop-opacity="0"/>
    </linearGradient>

    <mask id="crescent">
      <rect width="1600" height="420" fill="#000"/>
      <circle cx="1258" cy="164" r="82" fill="#fff"/>
      <circle cx="1294" cy="132" r="76" fill="#000"/>
    </mask>
  </defs>

  <rect width="1600" height="420" rx="26" fill="url(#sky)"/>

  <!-- twinkling stars -->
  <g fill="#fff6e6">
    <circle cx="142" cy="84" r="1.8" opacity=".85">
      <animate attributeName="opacity" values=".2;.95;.2" dur="5.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="236" cy="188" r="1.3" opacity=".6">
      <animate attributeName="opacity" values=".15;.8;.15" dur="7.1s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="318" cy="62" r="2.2" opacity=".9">
      <animate attributeName="opacity" values=".3;1;.3" dur="6.2s" begin=".6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="408" cy="150" r="1.2" opacity=".5">
      <animate attributeName="opacity" values=".1;.75;.1" dur="8.3s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="505" cy="92" r="1.7" opacity=".75">
      <animate attributeName="opacity" values=".2;.9;.2" dur="4.8s" begin="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="612" cy="176" r="1.4" opacity=".55">
      <animate attributeName="opacity" values=".1;.7;.1" dur="6.9s" begin=".9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="704" cy="58" r="2" opacity=".8">
      <animate attributeName="opacity" values=".25;1;.25" dur="5.8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="806" cy="128" r="1.2" opacity=".5">
      <animate attributeName="opacity" values=".1;.65;.1" dur="9.1s" begin="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="902" cy="70" r="1.6" opacity=".7">
      <animate attributeName="opacity" values=".2;.85;.2" dur="7.7s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1004" cy="160" r="1.1" opacity=".45">
      <animate attributeName="opacity" values=".1;.6;.1" dur="8.8s" begin="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1096" cy="86" r="1.9" opacity=".75">
      <animate attributeName="opacity" values=".2;.9;.2" dur="6.4s" begin=".3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1418" cy="120" r="1.7" opacity=".7">
      <animate attributeName="opacity" values=".15;.85;.15" dur="6.6s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1492" cy="242" r="1.3" opacity=".5">
      <animate attributeName="opacity" values=".1;.7;.1" dur="8.1s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1372" cy="322" r="1.5" opacity=".55">
      <animate attributeName="opacity" values=".12;.7;.12" dur="7.4s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="300" r="1.2" opacity=".4">
      <animate attributeName="opacity" values=".08;.5;.08" dur="9.6s" begin=".8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- little sparkles -->
  <g stroke="#f3e6ff" stroke-width="1.4" stroke-linecap="round" opacity=".75">
    <path d="M258 128v14m-7-7h14"/>
    <path d="M848 216v12m-6-6h12"/>
    <path d="M1188 62v16m-8-8h16"/>
    <path d="M1462 300v12m-6-6h12"/>
  </g>

  <!-- moon -->
  <g>
    <circle cx="1258" cy="164" r="210" fill="url(#halo)">
      <animate attributeName="opacity" values=".75;1;.75" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1258" cy="164" r="82" fill="url(#moon)" mask="url(#crescent)"/>
    <g stroke="#e6d3ff" fill="none" opacity=".28">
      <circle cx="1258" cy="164" r="104" stroke-width=".9"/>
      <circle cx="1258" cy="164" r="126" stroke-width=".6" stroke-dasharray="2 9"/>
    </g>
  </g>

  <!-- shooting star -->
  <g opacity="0" stroke-linecap="round">
    <animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="0;.68;.74;.8;1" dur="13s" repeatCount="indefinite"/>
    <line x1="520" y1="70" x2="600" y2="106" stroke="#d9c6f5" stroke-width="2" opacity=".55"/>
    <line x1="520" y1="70" x2="548" y2="83" stroke="#fff7ea" stroke-width="2.4"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;300 168;300 168" keyTimes="0;.68;.8;1" dur="13s" repeatCount="indefinite"/>
  </g>

  <!-- constellation -->
  <g stroke="#cbb6ee" stroke-width=".7" opacity=".22" fill="none">
    <path d="M660 300l44-26 56 14 32-40 48 22"/>
  </g>
  <g fill="#efe2ff" opacity=".55">
    <circle cx="660" cy="300" r="1.6"/>
    <circle cx="704" cy="274" r="2"/>
    <circle cx="760" cy="288" r="1.4"/>
    <circle cx="792" cy="248" r="1.8"/>
    <circle cx="840" cy="270" r="1.5"/>
  </g>

  <!-- drifting mist -->
  <path d="M0 330 Q240 286 470 326 T980 318 T1600 300V420H0Z" fill="url(#mist)"/>

  <!-- mountains -->
  <path d="M0 356 Q150 330 300 352 T620 344 T900 336 T1180 356 T1420 344 T1600 352V420H0Z" fill="#2a2449" opacity=".72"/>
  <path d="M0 402l118-58 92 44 74-38 106 58 96-30 92 40H0Z" fill="#1b1836" opacity=".95"/>
  <path d="M930 420l104-66 86 40 70-30 96 56H930Z" fill="#1b1836" opacity=".85"/>
  <path d="M0 420q120-32 250-22t250 22H0Z" fill="#0c0b1a"/>
  <path d="M460 420q180-36 380-24t300 24H460Z" fill="#0c0b1a"/>
  <path d="M1060 420q130-30 270-24t270 24H1060Z" fill="#0c0b1a"/>

  <!-- wordmark -->
  <g>
    <rect x="96" y="150" width="2" height="104" rx="1" fill="#d9b8ff" opacity=".55"/>
    <text x="128" y="204" fill="#f8f0e4" font-family="'Noto Serif SC','Songti SC','SimSun',Georgia,serif" font-size="46" letter-spacing="14">月と星の夜</text>
    <text x="130" y="248" fill="#c9b5e8" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="8">MOONLIT · STARRY · QUIET</text>
  </g>
</svg>
