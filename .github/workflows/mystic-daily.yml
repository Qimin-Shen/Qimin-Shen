name: 🌙 Mystic Daily Check-in

on:
  # 16:00 UTC is 00:00 on the following day in Asia/Shanghai.
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-check-in:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install IANA timezone data
        run: python -m pip install tzdata

      - name: Update today's check-in
        run: python scripts/update_daily.py --timezone Asia/Shanghai

      - name: Refresh the self-hosted language card
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py --timezone Asia/Shanghai

      - name: Commit only if something changed
        run: |
          if git diff --quiet -- README.md assets/github-stats.svg; then
            echo "Profile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-stats.svg
          git commit -m "🌙 Daily check-in & star track $(TZ=Asia/Shanghai date +'%Y-%m-%d')"
          git push
